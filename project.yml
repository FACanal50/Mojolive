# ---------------------------------------------------------------------------
# MojoLive — Proyecto Xcode generado con XcodeGen (https://github.com/yonaskolb/XcodeGen)
#
#   brew install xcodegen cmake
#   ./Scripts/build-libsrt.sh        # compila libsrt + mbedTLS -> Vendor/libsrt.xcframework
#   xcodegen generate                # genera MojoLive.xcodeproj
#   open MojoLive.xcodeproj
# ---------------------------------------------------------------------------
name: MojoLive

options:
  bundleIdPrefix: coop.coopmorteros
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""            # <- completar con el Team ID de Apple Developer
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"

targets:
  MojoLive:
    type: application
    platform: iOS
    sources:
      - path: MojoLive
        excludes:
          - "**/*.md"
    dependencies:
      - framework: Vendor/libsrt.xcframework
        embed: false               # librería estática: se linkea, no se embebe
      - sdk: libc++.tbd            # libsrt está escrita en C++
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: coop.coopmorteros.mojolive
        PRODUCT_NAME: MojoLive
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: MojoLive/Support/MojoLive-Bridging-Header.h
        INFOPLIST_FILE: MojoLive/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
        INFOPLIST_KEY_NSCameraUsageDescription: "MojoLive requiere acceso a la cámara para la transmisión de video en vivo."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "MojoLive requiere acceso al micrófono para capturar audio en el streaming."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "MojoLive requiere acceso a la red local para conectarse a servidores SRT."
        INFOPLIST_KEY_UIBackgroundModes: ["audio"]

  MojoLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MojoLiveTests
    dependencies:
      - target: MojoLive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(BUILT_PRODUCTS_DIR)/include"]
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MojoLive.app/MojoLive"

schemes:
  MojoLive:
    build:
      targets:
        MojoLive: all
